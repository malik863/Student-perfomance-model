<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduTrack - Student Performance Check</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f8fafc] h-screen flex flex-col items-center justify-center p-6">

    <div class="flex flex-col items-center mb-10">
        <div class="mb-4 text-[#0077b6]">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-20 h-20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
            </svg>
        </div>
        <h1 class="text-4xl font-extrabold text-[#1e293b] tracking-tight">EduTrack</h1>
        <p class="text-[#64748b] mt-1 font-medium">Your Journey, Supported.</p>
    </div>

    <div class="w-full max-w-sm">
        
        <a href="{% url 'form' %}"
   class="block w-full bg-[#0077b6] hover:bg-[#023e8a] text-white font-bold py-5 px-8 rounded-xl shadow-lg transition-all duration-300 transform hover:-translate-y-1 text-lg text-center">
    Start My Performance Check
       </a>
        
        <p class="mt-6 text-center text-sm text-[#94a3b8] font-medium">
            Private & Secure Assessment
        </p>
    </div>

</body>
</html>

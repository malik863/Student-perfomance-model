<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduTrack - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f8fafc] h-screen flex flex-col items-center justify-center p-6">

    <div class="flex flex-col items-center mb-8">
        <div class="mb-4 text-[#0077b6]">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
            </svg>
        </div>
        <h1 class="text-2xl font-black text-[#1e293b]">EduTrack</h1>
    </div>

    <div class="w-full max-w-sm bg-white rounded-3xl shadow-xl p-8 border border-gray-50">
        <h2 class="text-xl font-bold text-[#1e293b] mb-6">Welcome Back</h2>
        
            {% if error %}
    <div class="bg-red-100 text-red-700 p-3 rounded-xl mb-4">
        {{ error }}
    </div>
    {% endif %}
        <form method="POST" action="{% url 'login' %}" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Student Email</label>
                <input name="username" type="text" placeholder="username" class="w-full p-4 rounded-xl bg-gray-50 border-none outline-none focus:ring-2 focus:ring-[#0077b6]/30 transition-all">
            </div>
            
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Password</label>
                <input name="password" type="password" placeholder="••••••••" class="w-full p-4 rounded-xl bg-gray-50 border-none outline-none focus:ring-2 focus:ring-[#0077b6]/30 transition-all">
            </div>

            <button type="submit"  class="w-full bg-[#0077b6] text-white font-black py-4 rounded-2xl mt-4 shadow-lg shadow-blue-100 transition-all active:scale-95 uppercase text-sm tracking-wide">
                Login
            </button>

        </form>

        <p class="mt-8 text-center text-sm text-gray-400">
            Don't have an account? <a href="{% url 'signup' %}" class="text-[#0077b6] font-bold hover:underline">Sign Up</a>
        </p>
    </div>


</body>
</html>
